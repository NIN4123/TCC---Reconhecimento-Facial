<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar – Painel de Acesso</title>
<style>
  :root { --fundo: #eef1f4; --tinta: #14202b; --suave: #5b6b7a; --linha: #d5dce3; --marca: #1d3b5c; --no: #b4361b; --no-bg: #fbe5df; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--fundo); color: var(--tinta); min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  form { background: #fff; border: 1px solid var(--linha); border-radius: 10px; padding: 32px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 20px; color: var(--marca); }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--suave); }
  input { font: inherit; padding: 10px; border: 1px solid var(--linha); border-radius: 6px; color: var(--tinta); }
  input:focus-visible, button:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
  button { font: inherit; font-weight: 600; background: var(--marca); color: #fff; border: 0; padding: 11px; border-radius: 6px; cursor: pointer; }
  #erro { display: none; background: var(--no-bg); color: var(--no); padding: 10px; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Controle de Acesso Facial</h1>
  <div id="erro" role="alert"></div>
  <label>Usuário <input name="usuario" autocomplete="username" required autofocus></label>
  <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
  <button type="submit">Entrar</button>
</form>
<script>
  const e = new URLSearchParams(location.search).get("erro");
  if (e) { const c = document.getElementById("erro"); c.style.display = "block";
    c.textContent = e === "banco" ? "Não foi possível acessar o banco de dados. O MySQL está ligado?" : "Usuário ou senha incorretos."; }
</script>
</body>
</html>
