<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Acesso</title>
<style>
  :root {
    --fundo: #eef1f4; --painel: #ffffff; --tinta: #14202b; --suave: #5b6b7a;
    --linha: #d5dce3; --marca: #1d3b5c; --ok: #0f7a5c; --ok-bg: #dff3ec;
    --no: #b4361b; --no-bg: #fbe5df;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--fundo); color: var(--tinta); display: flex; min-height: 100vh; }
  nav { width: 220px; background: var(--marca); color: #fff; padding: 24px 16px; flex-shrink: 0; }
  nav h1 { font-size: 18px; font-weight: 600; padding: 0 8px 24px; line-height: 1.25; }
  nav button { display: block; width: 100%; text-align: left; background: none; border: 0; color: #b9c8d8; font: inherit; padding: 10px 12px; border-radius: 6px; cursor: pointer; }
  nav button:hover { background: rgba(255,255,255,.08); color: #fff; }
  nav button.ativo { background: #fff; color: var(--marca); font-weight: 600; }
  nav button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
  main { flex: 1; padding: 32px; max-width: 1000px; }
  h2 { font-size: 22px; margin-bottom: 20px; }
  section { display: none; } section.ativo { display: block; }

  /* Última leitura: o elemento principal da tela */
  .leitura { display: flex; align-items: center; gap: 20px; padding: 24px; border-radius: 10px; margin-bottom: 24px; border-left: 10px solid var(--ok); background: var(--ok-bg); }
  .leitura.negado { border-color: var(--no); background: var(--no-bg); }
  .leitura .nome { font-size: 28px; font-weight: 700; }
  .leitura .detalhe { color: var(--suave); margin-top: 4px; }
  .leitura .estado { margin-left: auto; font-size: 20px; font-weight: 700; color: var(--ok); }
  .leitura.negado .estado { color: var(--no); }

  .numeros { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .numero { background: var(--painel); border: 1px solid var(--linha); border-radius: 8px; padding: 14px 18px; min-width: 150px; }
  .numero b { display: block; font-size: 26px; }
  .numero span { color: var(--suave); font-size: 14px; }

  .caixa { background: var(--painel); border: 1px solid var(--linha); border-radius: 8px; padding: 20px; margin-bottom: 24px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; color: var(--suave); font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--linha); }
  td { padding: 10px; border-bottom: 1px solid var(--linha); }
  .tag { padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
  .tag.liberado, .tag.ativo { background: var(--ok-bg); color: var(--ok); }
  .tag.negado, .tag.bloqueado { background: var(--no-bg); color: var(--no); }

  form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--suave); }
  input, select { font: inherit; padding: 9px 10px; border: 1px solid var(--linha); border-radius: 6px; color: var(--tinta); }
  .btn { font: inherit; font-weight: 600; background: var(--marca); color: #fff; border: 0; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
  .btn.sec { background: none; color: var(--marca); border: 1px solid var(--marca); padding: 5px 12px; }
  form .btn { grid-column: 1 / -1; justify-self: start; }

  @media (max-width: 720px) {
    body { flex-direction: column; } nav { width: 100%; padding: 12px; }
    nav h1 { padding-bottom: 8px; } main { padding: 16px; } form { grid-template-columns: 1fr; }
    .leitura { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<nav>
  <h1>Controle de Acesso<br>Facial</h1>
  <button class="ativo" data-ver="painel">Painel</button>
  <button data-ver="usuarios">Usuários</button>
  <button data-ver="historico">Histórico de acessos</button>
  <button id="sair" style="margin-top:24px">Sair</button>
</nav>

<main>
  <section id="painel" class="ativo">
    <h2>Painel</h2>
    <div class="leitura" id="leitura"></div>
    <div class="numeros">
      <div class="numero"><b id="n-hoje">0</b><span>acessos hoje</span></div>
      <div class="numero"><b id="n-lib">0</b><span>liberados</span></div>
      <div class="numero"><b id="n-neg">0</b><span>negados</span></div>
      <div class="numero"><b id="n-usr">0</b><span>usuários ativos</span></div>
    </div>
    <div class="caixa"><table><thead><tr><th>Horário</th><th>Pessoa</th><th>Resultado</th></tr></thead><tbody id="recentes"></tbody></table></div>
  </section>

  <section id="usuarios">
    <h2>Usuários</h2>
    <div class="caixa">
      <form id="form-cadastro">
        <label>Nome completo <input id="f-nome" required></label>
        <label>Perfil
          <select id="f-perfil"><option>aluno</option><option>professor</option><option>funcionario</option><option>visitante</option></select>
        </label>
        <button class="btn" type="submit">Cadastrar (abre a câmera)</button>
      </form>
      <p id="msg" style="margin-top:12px;color:var(--suave)"></p>
    </div>
    <div class="caixa"><table><thead><tr><th>Nome</th><th>Perfil</th><th>Situação</th><th></th></tr></thead><tbody id="lista-usuarios"></tbody></table></div>
  </section>

  <section id="historico">
    <h2>Histórico de acessos</h2>
    <div class="caixa"><table><thead><tr><th>Data e hora</th><th>Pessoa</th><th>Resultado</th></tr></thead><tbody id="lista-historico"></tbody></table></div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const tag = (t) => `<span class="tag ${t}">${t}</span>`;
  const PERFIS = ["aluno", "professor", "funcionario", "visitante"];

  // Conversa com o backend (app.py). Se a sessão expirar, volta para o login.
  async function api(url, opcoes) {
    const r = await fetch(url, opcoes);
    if (r.status === 401) { location.href = "/login"; throw new Error("Sessão expirada"); }
    const dados = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(dados.erro || "Erro inesperado");
    return dados;
  }
  const enviar = (url, metodo, corpo) => api(url, { method: metodo, headers: { "Content-Type": "application/json" }, body: corpo ? JSON.stringify(corpo) : undefined });

  let ultimo = {};  // evita redesenhar (e fechar um <select> aberto) quando nada mudou
  const mudou = (chave, valor) => { const j = JSON.stringify(valor); if (ultimo[chave] === j) return false; ultimo[chave] = j; return true; };

  async function atualizar() {
    try {
      const [r, usuarios, acessos] = await Promise.all([api("/api/resumo"), api("/api/usuarios"), api("/api/acessos?limite=100")]);
      if (mudou("resumo", r)) {
        const u = r.ultimo;
        $("leitura").className = "leitura " + (u && u.resultado === "negado" ? "negado" : "");
        $("leitura").innerHTML = u
          ? `<div><div class="nome">${esc(u.nome)}</div><div class="detalhe">Última leitura em ${esc(u.hora)}</div></div><div class="estado">${u.resultado === "liberado" ? "Acesso liberado" : "Acesso negado"}</div>`
          : `<div><div class="nome">Nenhum acesso ainda</div><div class="detalhe">Inicie o reconhecimento para ver as leituras aqui.</div></div>`;
        $("n-hoje").textContent = r.total; $("n-lib").textContent = r.liberados;
        $("n-neg").textContent = r.negados; $("n-usr").textContent = r.usuarios_ativos;
      }
      if (mudou("acessos", acessos)) {
        const linha = (a, completo) => `<tr><td>${esc(completo ? a.hora : a.hora.slice(11, 16))}</td><td>${esc(a.nome)}</td><td>${tag(a.resultado)}</td></tr>`;
        $("recentes").innerHTML = acessos.slice(0, 5).map(a => linha(a, false)).join("");
        $("lista-historico").innerHTML = acessos.map(a => linha(a, true)).join("");
      }
      if (mudou("usuarios", usuarios)) {
        $("lista-usuarios").innerHTML = usuarios.map(u => `<tr><td>${esc(u.nome)}</td>
          <td><select data-perfil="${u.id}">${PERFIS.map(p => `<option ${p === u.perfil ? "selected" : ""}>${p}</option>`).join("")}</select></td>
          <td>${tag(u.ativo ? "ativo" : "bloqueado")}</td>
          <td><button class="btn sec" data-ativo="${u.id}" data-valor="${u.ativo ? 0 : 1}">${u.ativo ? "Bloquear" : "Reativar"}</button>
              <button class="btn sec" data-excluir="${u.id}" data-nome="${esc(u.nome)}">Excluir</button></td></tr>`).join("");
      }
    } catch (e) { $("msg").textContent = e.message; }
  }

  document.querySelectorAll("nav button[data-ver]").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("nav button, section").forEach(e => e.classList.remove("ativo"));
    b.classList.add("ativo"); $(b.dataset.ver).classList.add("ativo");
  }));
  $("sair").addEventListener("click", () => { location.href = "/sair"; });

  $("lista-usuarios").addEventListener("click", async e => {
    const d = e.target.dataset;
    try {
      if (d.ativo) await enviar(`/api/usuarios/${d.ativo}/ativo`, "POST", { ativo: d.valor === "1" });
      else if (d.excluir) {
        if (!confirm(`Excluir ${d.nome}? Os dados faciais dessa pessoa serão apagados.`)) return;
        await enviar(`/api/usuarios/${d.excluir}`, "DELETE");
      } else return;
      atualizar();
    } catch (err) { $("msg").textContent = err.message; }
  });
  $("lista-usuarios").addEventListener("change", async e => {
    if (!e.target.dataset.perfil) return;
    try { await enviar(`/api/usuarios/${e.target.dataset.perfil}/perfil`, "POST", { perfil: e.target.value }); }
    catch (err) { $("msg").textContent = err.message; }
  });
  $("form-cadastro").addEventListener("submit", async e => {
    e.preventDefault();
    try {
      const d = await enviar("/api/cadastrar", "POST", { nome: $("f-nome").value.trim(), perfil: $("f-perfil").value });
      $("msg").textContent = d.mensagem; e.target.reset();
    } catch (err) { $("msg").textContent = err.message; }
  });

  atualizar();
  setInterval(atualizar, 3000);  // atualiza sozinho a cada 3 s (útil na demonstração)
</script>
</body>
</html>
